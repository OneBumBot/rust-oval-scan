[workspace]
members = [
 "crates/core",
 "crates/storage",
 "crates/ssh",
 "crates/scanner",
 "crates/cli",
 "crates/app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Iurii Pianov"]
repository = "https://github.com/onebumbot/oval-rust-scan"

[workspace.dependencies]
tokio = {version = "1", features = ["full"]}
futures = "0.3"
tracing = "0.1"
tracing-subscriber = {
    version ="0.3",
    features = ["env-filter","fmt"]
}
serde = {version = "1", features = ["derive"]}
serde_json = "1.0"

[profile.profiling]
inherits = "release"
debug = true
