[workspace]
members = [
 "crates/core",
 "crates/storage",
 "crates/ssh",
 "crates/scanner",
 "crates/cli",
 "crates/app",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
authors = ["Iurii Pianov"]
repository = "https://github.com/onebumbot/oval-rust-scan"

[profile.profiling]
inherits = "release"
debug = true
